[package]
name = "orderly-desktop"
version = "0.0.0"
description = "Orderly. Less chaos. More clarity."
edition = "2021"

[lib]
name = "orderly_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
